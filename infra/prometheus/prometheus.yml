# Prometheus scrape configuration for the Foundation.
#
# Three targets: Prometheus itself, the API and the worker. Static targets rather than service
# discovery, because the Foundation stack is a fixed set of Compose services and a discovery
# mechanism would be machinery with nothing to discover.
#
# Prometheus resolves the service names on the Compose network, so nothing here depends on which
# host port the stack happens to publish.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: iacode-foundation

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          component: observability

  - job_name: iacode-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api

  # The worker exposes the Temporal SDK's own Prometheus endpoint. It carries workflow and activity
  # counters the SDK produces; the application does not add instruments of its own, because Gate 0
  # runs one smoke workflow and a hand-rolled metric about it would measure the smoke check rather
  # than anything operational.
  - job_name: iacode-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels:
          component: worker

  # Gate 2 adds instruments the SDK cannot produce, because they are about agent runs rather than
  # about workflow tasks: how many runs started, how long they took, how many turns they executed,
  # how many are paused on a tool request. They live on a second port because the SDK core binds
  # 9100 itself and a process cannot bind it twice.
  - job_name: iacode-agent-runtime
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          component: agent-runtime
