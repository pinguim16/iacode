# Load every dashboard from the mounted directory.
#
# `allowUiUpdates: false` on purpose: the dashboard is a file in this repository, and a change made
# in the browser would be lost on the next restart with no trace of what it was. Editing the JSON is
# the supported path.

apiVersion: 1

providers:
  - name: iacode-foundation
    orgId: 1
    folder: IACode
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
