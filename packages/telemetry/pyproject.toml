[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iacode-telemetry"
version = "0.1.0"
description = "Structured logging and ambient correlation context for IACode runtime components."
requires-python = ">=3.12"
dependencies = ["iacode-common==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
