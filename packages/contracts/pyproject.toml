[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iacode-contracts"
version = "0.1.0"
description = "Response and error contracts shared across IACode process boundaries."
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[tool.setuptools.packages.find]
where = ["src"]
