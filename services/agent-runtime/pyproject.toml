[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iacode-agent-runtime"
version = "0.1.0"
description = "The IACode agent runtime: durable agent execution, provider-neutral, executing no tool."
requires-python = ">=3.12"
dependencies = [
  "iacode-common==0.1.0",
  "iacode-contracts==0.1.0",
  "iacode-persistence==0.1.0",
  "iacode-telemetry==0.1.0",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "pydantic==2.13.5",
  "sqlalchemy[asyncio]==2.0.54",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_classes = ["Test*", "*Tests"]
addopts = "-q --strict-markers --strict-config"
