[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iacode-sandbox"
version = "0.1.0"
description = "The IACode sandbox: policy-isolated execution of agent tools in disposable containers."
requires-python = ">=3.12"
dependencies = [
  "iacode-common==0.1.0",
  "iacode-contracts==0.1.0",
  "iacode-persistence==0.1.0",
  "iacode-telemetry==0.1.0",
  "minio==7.2.20",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.54",
  "temporalio==1.33.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_classes = ["Test*", "*Tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "engine: the case drives a real container engine and runs inside the sandbox service image",
  "integration: the case needs the running stack's database and bucket; the verification runs it, the mandatory gate deselects it",
]
