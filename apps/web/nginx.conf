# Serving the IACode web shell.
#
# A single-page application needs every unknown path to return index.html, or a reload on any route
# other than "/" is a 404. Static assets keep a long cache because their names are content-hashed by
# the build; index.html and config.json must not, or a deployed change would be invisible until the
# browser decided to revalidate.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output. The name changes whenever the content does, so a year is safe.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Written at container start from the environment. Caching it would pin the browser to the
    # address the container had when the page was first loaded.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Minimal, and only what a static shell can honestly assert. A Content-Security-Policy that
    # listed a backend host would contradict the runtime configuration this image is built around.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
