[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The URL is deliberately absent. Putting it here would either hardcode a password into a committed
# file or invite one to be pasted in later; ``migrations/env.py`` reads the same typed configuration
# the application reads, so there is exactly one source for it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
